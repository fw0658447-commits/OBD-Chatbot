name: Regulatory source monitor

on:
  schedule:
    - cron: '15 5 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-source-monitor
  cancel-in-progress: false

jobs:
  check_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official and curated source metadata
        run: python scripts/monitor_regulatory_sources.py
      - name: Discover cross-standard reference candidates
        run: python scripts/discover_cross_references.py
      - name: Validate cross-market regulatory graph and dependencies
        run: python scripts/validate_regulatory_graph.py
      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/source_status.json knowledge/regulatory_graph_review.json knowledge/regulatory_graph_review.md knowledge/regulatory_link_candidates.json
          if [ -d knowledge/official_documents ]; then git add knowledge/official_documents/; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh international regulatory source snapshot"
            git push
          fi
